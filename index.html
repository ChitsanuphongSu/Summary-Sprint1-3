    <title>Gaming Statistics Dashboard — Sprint 1 → 3 Journey</title>
    <style>
      :root {
        --bg: #f7f8fb;
        --pn: #fff;
        --ln: #e2e6ef;
        --tx: #151a2e;
        --mu: #5d6784;
        --s1: #d97706;
        --s2: #4f46e5;
        --s3: #0d9488;
        box-sizing: border-box;
      }
      * {
        box-sizing: inherit;
        margin: 0;
      }
      html,
      body {
        height: 100%;
        background: #e9ebf3;
        color: var(--tx);
        font-family:
          "Noto Sans Thai", "Sarabun", "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      #st {
        width: min(100vw, calc((100vh - 44px) * 1.7778));
        aspect-ratio: 16/9;
        container-type: inline-size;
        position: relative;
        background: var(--bg);
      }
      .s {
        position: absolute;
        inset: 0;
        padding: 3.6cqw 5cqw;
        display: none;
        flex-direction: column;
        font-size: 1.6cqw;
      }
      .s.on {
        display: flex;
      }
      .k {
        font-weight: 700;
        font-size: 1.3cqw;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 0.4cqw;
      }
      h1 {
        font-size: 6cqw;
        line-height: 1.08;
        font-weight: 800;
      }
      h2 {
        font-size: 3cqw;
        font-weight: 800;
        line-height: 1.2;
        margin-bottom: 0.4cqw;
      }
      .sb {
        color: var(--mu);
        margin-bottom: 1.4cqw;
      }
      .g {
        display: grid;
        gap: 1.1cqw;
        align-content: start;
      }
      .c {
        background: var(--pn);
        border: 1px solid var(--ln);
        border-radius: 0.9cqw;
        padding: 1.1cqw 1.4cqw;
        border-top: 0.3cqw solid var(--a, var(--ln));
      }
      .c b {
        display: block;
        font-size: 1.75cqw;
        margin-bottom: 0.3cqw;
      }
      .c p,
      .c li {
        color: var(--mu);
        line-height: 1.45;
      }
      .c ul {
        padding-left: 1.4cqw;
      }
      .fl {
        display: flex;
        align-items: stretch;
        gap: 0.6cqw;
      }
      .fl > .c {
        flex: 1;
      }
      .ar {
        align-self: center;
        font-size: 2cqw;
        color: var(--mu);
      }
      .p {
        display: inline-block;
        border: 1px solid var(--ln);
        background: var(--pn);
        border-radius: 99cqw;
        padding: 0.35cqw 1cqw;
        margin: 0 0.4cqw 0.5cqw 0;
        font-size: 1.35cqw;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--pn);
        border: 1px solid var(--ln);
        border-radius: 0.8cqw;
      }
      td,
      th {
        padding: 0.65cqw 0.9cqw;
        border-bottom: 1px solid var(--ln);
        text-align: left;
        vertical-align: top;
      }
      th {
        color: var(--mu);
        font-weight: 600;
      }
      .r1 {
        --a: var(--s1);
      }
      .r2 {
        --a: var(--s2);
      }
      .r3 {
        --a: var(--s3);
      }
      .t1 {
        color: var(--s1);
      }
      .t2 {
        color: var(--s2);
      }
      .t3 {
        color: var(--s3);
      }
      .warn {
        border-left: 0.3cqw solid var(--s1);
        background: #fffaf0;
      }
      .src {
        position: absolute;
        right: 5cqw;
        bottom: 1.2cqw;
        font-size: 1.05cqw;
        color: #9aa3bd;
      }
      .nt {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        background: #151a2ef0;
        color: #fff;
        padding: 1cqw 2cqw;
        font-size: 1.4cqw;
        line-height: 1.5;
        z-index: 5;
      }
      #st.sn .s.on .nt {
        display: block;
      }
      #bar {
        height: 44px;
        display: flex;
        gap: 10px;
        align-items: center;
        color: var(--mu);
        font-size: 14px;
      }
      #bar button {
        background: var(--pn);
        color: var(--tx);
        border: 1px solid var(--ln);
        border-radius: 8px;
        padding: 6px 14px;
        cursor: pointer;
        font: inherit;
      }
      #bar button:focus-visible {
        outline: 2px solid var(--s2);
      }
    </style>
